# Render Blueprint – välj New > Blueprint och koppla detta GitHub-repo.
# Gratisinstans kan gå i viloläge. Se PUBLICERA.md innan publik lansering.
services:
  - type: web
    name: tankkollen-sverige
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
